<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">MySQL 深分页问题</title>
  <desc id="desc">LIMIT offset size 会先扫描并丢弃 offset 行，再返回 size 行。</desc>
  <rect width="1120" height="560" rx="24" fill="#f8fafc"/>
  <text x="560" y="58" text-anchor="middle" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="34" font-weight="700" fill="#0f172a">深分页为什么慢：先跳过，再返回</text>
  <g font-family="Arial, 'Microsoft YaHei', sans-serif">
    <text x="92" y="130" font-size="24" font-weight="700" fill="#0f172a">LIMIT 10000, 20</text>
    <text x="92" y="170" font-size="20" fill="#475569">数据库需要先找到并丢弃前 10000 行，再取 20 行</text>
    <rect x="88" y="224" width="760" height="68" rx="14" fill="#e2e8f0"/>
    <rect x="88" y="224" width="640" height="68" rx="14" fill="#fecaca"/>
    <rect x="728" y="224" width="120" height="68" rx="14" fill="#bbf7d0"/>
    <text x="408" y="265" text-anchor="middle" font-size="22" font-weight="700" fill="#991b1b">扫描并丢弃 offset 行</text>
    <text x="788" y="265" text-anchor="middle" font-size="22" font-weight="700" fill="#166534">返回 size 行</text>
    <text x="88" y="330" font-size="20" fill="#475569">offset 越大，前面被丢弃的数据越多，成本越高。</text>

    <rect x="88" y="376" width="944" height="92" rx="18" fill="#0f172a"/>
    <text x="128" y="416" font-size="22" font-weight="700" fill="#ffffff">优化答法</text>
    <text x="128" y="452" font-size="20" fill="#dbeafe">用主键或时间游标定位范围：WHERE id &lt; last_id ORDER BY id DESC LIMIT 20</text>
  </g>
</svg>
