<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380">
  <rect width="800" height="380" fill="#0f172a"/>
  <text x="400" y="30" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold" font-family="sans-serif">MCP 协议：AI 领域的 USB-C</text>
  <text x="400" y="52" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">一次开发，多处复用——工具开发者只写一个 MCP Server，所有 AI 应用都能复用</text>
  <!-- Host layer -->
  <rect x="120" y="75" width="560" height="45" rx="8" fill="#3b82f6"/>
  <text x="400" y="103" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold" font-family="sans-serif">MCP Host（AI 应用）：Claude Desktop / VS Code / Cursor</text>
  <!-- Client layer -->
  <rect x="180" y="135" width="440" height="40" rx="8" fill="#8b5cf6"/>
  <text x="400" y="160" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">MCP Client：JSON-RPC 2.0 通信，每个 Server 一个独立实例</text>
  <!-- Server layer -->
  <rect x="180" y="190" width="440" height="40" rx="8" fill="#f59e0b"/>
  <text x="400" y="215" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">MCP Server：暴露 Resources / Tools / Prompts / Sampling</text>
  <!-- Data layer -->
  <rect x="40" y="250" width="220" height="45" rx="8" fill="#10b981"/>
  <text x="150" y="268" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">Data Source</text>
  <text x="150" y="285" text-anchor="middle" fill="#d1fae5" font-size="10" font-family="sans-serif">本地文件 / Git / API</text>
  <rect x="290" y="250" width="220" height="45" rx="8" fill="#10b981"/>
  <text x="400" y="268" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">Data Source</text>
  <text x="400" y="285" text-anchor="middle" fill="#d1fae5" font-size="10" font-family="sans-serif">数据库 / 外部 API</text>
  <rect x="540" y="250" width="220" height="45" rx="8" fill="#10b981"/>
  <text x="650" y="268" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">Data Source</text>
  <text x="650" y="285" text-anchor="middle" fill="#d1fae5" font-size="10" font-family="sans-serif">GitHub / Slack</text>
  <!-- Connections -->
  <line x1="400" y1="120" x2="400" y2="135" stroke="#64748b" stroke-width="1.5"/>
  <line x1="400" y1="175" x2="400" y2="190" stroke="#64748b" stroke-width="1.5"/>
  <line x1="290" y1="228" x2="150" y2="250" stroke="#64748b" stroke-width="1"/>
  <line x1="400" y1="228" x2="400" y2="250" stroke="#64748b" stroke-width="1"/>
  <line x1="510" y1="228" x2="650" y2="250" stroke="#64748b" stroke-width="1"/>
  <!-- Bottom -->
  <rect x="40" y="320" width="720" height="45" rx="6" fill="#1e293b"/>
  <text x="400" y="340" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">MCP 前：工具数 × LLM 数量（N×M 适配） → MCP 后：工具数 + LLM 数量（N+M 接入）</text>
  <text x="400" y="358" text-anchor="middle" fill="#64748b" font-size="10" font-family="sans-serif">HTTP 统一了网页传输，MCP 统一 AI 与外部工具的交互方式</text>
</svg>
