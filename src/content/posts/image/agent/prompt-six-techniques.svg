<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280">
  <rect width="800" height="280" fill="#0f172a"/>
  <text x="400" y="28" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold" font-family="sans-serif">Prompt Engineering 六大核心技巧</text>
  <rect x="20" y="45" width="240" height="65" rx="8" fill="#3b82f6"/>
  <text x="140" y="72" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">① 角色扮演</text>
  <text x="140" y="92" text-anchor="middle" fill="#bfdbfe" font-size="10" font-family="sans-serif">激活领域知识分布</text>
  <text x="140" y="105" text-anchor="middle" fill="#bfdbfe" font-size="10" font-family="sans-serif">精准定义专家身份</text>
  <rect x="275" y="45" width="240" height="65" rx="8" fill="#f59e0b"/>
  <text x="395" y="72" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">② 思维链 CoT</text>
  <text x="395" y="92" text-anchor="middle" fill="#fef3c7" font-size="10" font-family="sans-serif">给模型留推理草稿纸</text>
  <text x="395" y="105" text-anchor="middle" fill="#fef3c7" font-size="10" font-family="sans-serif">Zero-shot / 引导式 / 结构化</text>
  <rect x="530" y="45" width="250" height="65" rx="8" fill="#10b981"/>
  <text x="655" y="72" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">③ 少样本 Few-shot</text>
  <text x="655" y="92" text-anchor="middle" fill="#d1fae5" font-size="10" font-family="sans-serif">1~3个示例比文字更有效</text>
  <text x="655" y="105" text-anchor="middle" fill="#d1fae5" font-size="10" font-family="sans-serif">相关性+多样性+清晰性</text>
  <rect x="20" y="125" width="240" height="65" rx="8" fill="#8b5cf6"/>
  <text x="140" y="152" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">④ 任务分解</text>
  <text x="140" y="172" text-anchor="middle" fill="#ddd6fe" font-size="10" font-family="sans-serif">静态分解 / 动态分解</text>
  <text x="140" y="185" text-anchor="middle" fill="#ddd6fe" font-size="10" font-family="sans-serif">复杂任务拆成子任务</text>
  <rect x="275" y="125" width="240" height="65" rx="8" fill="#ef4444"/>
  <text x="395" y="152" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">⑤ 结构化输出</text>
  <text x="395" y="172" text-anchor="middle" fill="#fecaca" font-size="10" font-family="sans-serif">JSON Schema + 原生支持</text>
  <text x="395" y="185" text-anchor="middle" fill="#fecaca" font-size="10" font-family="sans-serif">格式降级 + 解析失败重试</text>
  <rect x="530" y="125" width="250" height="65" rx="8" fill="#06b6d4"/>
  <text x="655" y="152" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">⑥ XML 标签与预填充</text>
  <text x="655" y="172" text-anchor="middle" fill="#cffafe" font-size="10" font-family="sans-serif">语义标签保持一致性</text>
  <text x="655" y="185" text-anchor="middle" fill="#cffafe" font-size="10" font-family="sans-serif">预填强制跳过前言</text>
  <!-- Bottom -->
  <rect x="60" y="210" width="680" height="50" rx="6" fill="#1e293b"/>
  <text x="400" y="232" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">核心原则：一次写不准，5-10轮"写完→跑case→发现边缘→打补丁"循环才出生产级 Prompt</text>
  <text x="400" y="250" text-anchor="middle" fill="#64748b" font-size="10" font-family="sans-serif">简单任务一句话够用 | 复杂任务四要素明确边界 | 过度设计=噪音稀释焦点</text>
</svg>
