<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#0f172a"/>
  <text x="400" y="32" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold" font-family="sans-serif">ReAct 模式五大组件协同流程</text>
  <rect x="30" y="55" width="140" height="55" rx="8" fill="#3b82f6"/>
  <text x="100" y="78" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">历史上下文</text>
  <text x="100" y="97" text-anchor="middle" fill="#bfdbfe" font-size="10" font-family="sans-serif">推理+动作+观察</text>
  <path d="M170 82 L210 82" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="215" y="55" width="140" height="55" rx="8" fill="#8b5cf6"/>
  <text x="285" y="78" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">LLM 推理模块</text>
  <text x="285" y="97" text-anchor="middle" fill="#ddd6fe" font-size="10" font-family="sans-serif">逻辑分析+规划</text>
  <path d="M355 82 L395 82" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="400" y="55" width="140" height="55" rx="8" fill="#f59e0b"/>
  <text x="470" y="78" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">工具集与技能库</text>
  <text x="470" y="97" text-anchor="middle" fill="#fef3c7" font-size="10" font-family="sans-serif">原子工具+Skills</text>
  <path d="M540 82 L580 82" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="585" y="55" width="140" height="55" rx="8" fill="#10b981"/>
  <text x="655" y="78" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">反馈观察机制</text>
  <text x="655" y="97" text-anchor="middle" fill="#d1fae5" font-size="10" font-family="sans-serif">环境响应采集</text>
  <!-- Real-time input -->
  <rect x="100" y="140" width="600" height="40" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="400" y="165" text-anchor="middle" fill="#93c5fd" font-size="12" font-family="sans-serif">实时环境输入：系统告警 / 监控指标 / 用户反馈 / 工具返回结果</text>
  <!-- Flow steps -->
  <rect x="60" y="220" width="140" height="50" rx="8" fill="#2563eb"/>
  <text x="130" y="240" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">① 用户提问</text>
  <text x="130" y="258" text-anchor="middle" fill="#bfdbfe" font-size="10" font-family="sans-serif">"接口为什么慢"</text>
  <path d="M200 245 L240 245" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="245" y="220" width="140" height="50" rx="8" fill="#7c3aed"/>
  <text x="315" y="240" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">② LLM 推理</text>
  <text x="315" y="258" text-anchor="middle" fill="#ddd6fe" font-size="10" font-family="sans-serif">决定查监控</text>
  <path d="M385 245 L425 245" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="430" y="220" width="140" height="50" rx="8" fill="#d97706"/>
  <text x="500" y="240" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">③ 执行工具</text>
  <text x="500" y="258" text-anchor="middle" fill="#fef3c7" font-size="10" font-family="sans-serif">query_slow_sql()</text>
  <path d="M570 245 L610 245" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="615" y="220" width="130" height="50" rx="8" fill="#059669"/>
  <text x="680" y="240" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">④ 观察结果</text>
  <text x="680" y="258" text-anchor="middle" fill="#d1fae5" font-size="10" font-family="sans-serif">得到慢SQL</text>
  <!-- Loop back -->
  <path d="M680 270 L680 320 L130 320 L130 270" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#ap)"/>
  <text x="400" y="338" text-anchor="middle" fill="#a78bfa" font-size="11" font-family="sans-serif">循环迭代：直到 LLM 判断任务完成（不再需要调用工具）</text>
  <!-- Exit -->
  <rect x="280" y="370" width="240" height="42" rx="8" fill="#10b981"/>
  <text x="400" y="390" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold" font-family="sans-serif">⑤ 最终输出：结构化排查报告</text>
  <text x="400" y="408" text-anchor="middle" fill="#d1fae5" font-size="10" font-family="sans-serif"/>
  <!-- Bottom bar -->
  <rect x="30" y="440" width="740" height="40" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
  <text x="400" y="460" text-anchor="middle" fill="#fca5a5" font-size="11" font-family="sans-serif">🔒 安全边界：最大迭代轮次 10~20 轮 | Token 消耗阈值 | 超时强制退出</text>
  <text x="400" y="476" text-anchor="middle" fill="#fca5a5" font-size="11" font-family="sans-serif"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8b5cf6"/></marker>
  </defs>
</svg>
