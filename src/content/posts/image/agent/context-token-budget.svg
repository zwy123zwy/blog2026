<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
  <rect width="800" height="350" fill="#0f172a"/>
  <text x="400" y="28" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold" font-family="sans-serif">上下文 Token 预算的三级淘汰策略</text>
  <!-- High priority -->
  <rect x="40" y="50" width="720" height="65" rx="8" fill="#dc2626" opacity="0.25"/>
  <rect x="40" y="50" width="720" height="65" rx="8" fill="none" stroke="#ef4444" stroke-width="2"/>
  <text x="65" y="78" text-anchor="middle" fill="#ef4444" font-size="13" font-weight="bold" font-family="sans-serif">P0</text>
  <text x="200" y="78" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold" font-family="sans-serif">高优先级：绝对保护</text>
  <text x="400" y="78" text-anchor="middle" fill="#fca5a5" font-size="11" font-family="sans-serif">System Constraints + 核心工具描述 + 安全规则</text>
  <text x="400" y="100" text-anchor="middle" fill="#fca5a5" font-size="11" font-family="sans-serif">永不丢失，确保逻辑一致性和安全底线</text>
  <!-- Medium priority -->
  <rect x="40" y="130" width="720" height="55" rx="8" fill="#d97706" opacity="0.2"/>
  <rect x="40" y="130" width="720" height="55" rx="8" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <text x="65" y="155" text-anchor="middle" fill="#f59e0b" font-size="13" font-weight="bold" font-family="sans-serif">P1</text>
  <text x="200" y="155" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold" font-family="sans-serif">中优先级：可精简</text>
  <text x="400" y="155" text-anchor="middle" fill="#fde68a" font-size="11" font-family="sans-serif">RAG 检索的背景资料 → 二次裁剪，仅保留核心段落</text>
  <text x="400" y="175" text-anchor="middle" fill="#fde68a" font-size="11" font-family="sans-serif"/>
  <!-- Low priority -->
  <rect x="40" y="200" width="720" height="55" rx="8" fill="#2563eb" opacity="0.2"/>
  <rect x="40" y="200" width="720" height="55" rx="8" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <text x="65" y="225" text-anchor="middle" fill="#3b82f6" font-size="13" font-weight="bold" font-family="sans-serif">P2</text>
  <text x="200" y="225" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold" font-family="sans-serif">低优先级：可折叠</text>
  <text x="400" y="225" text-anchor="middle" fill="#bfdbfe" font-size="11" font-family="sans-serif">早期对话历史 → AI 摘要压缩，保留关键决策和未解决问题</text>
  <text x="400" y="245" text-anchor="middle" fill="#bfdbfe" font-size="11" font-family="sans-serif"/>
  <!-- Context Caching -->
  <rect x="100" y="278" width="600" height="55" rx="6" fill="#1e293b" stroke="#8b5cf6" stroke-width="1"/>
  <text x="400" y="300" text-anchor="middle" fill="#c084fc" font-size="12" font-weight="bold" font-family="sans-serif">Context Caching（配套优化）</text>
  <text x="400" y="320" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">大规模并发请求中，相同 System Prompt 只加载一次 → 降低首 Token 延迟和推理成本</text>
</svg>
