<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180">
  <rect width="800" height="180" fill="#0f172a"/>
  <text x="400" y="25" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold" font-family="sans-serif">记忆操作的生命周期</text>
  <rect x="15" y="45" width="115" height="50" rx="8" fill="#3b82f6"/>
  <text x="72" y="75" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">Encode 编码</text>
  <path d="M130 70 L145 70" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="150" y="45" width="115" height="50" rx="8" fill="#8b5cf6"/>
  <text x="207" y="75" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">Storage 存储</text>
  <path d="M265 70 L280 70" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="285" y="45" width="115" height="50" rx="8" fill="#f59e0b"/>
  <text x="342" y="75" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">Retrieval 提取</text>
  <path d="M400 70 L415 70" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="420" y="45" width="125" height="50" rx="8" fill="#10b981"/>
  <text x="482" y="75" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">Consolidation 巩固</text>
  <path d="M545 70 L560 70" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="565" y="45" width="115" height="50" rx="8" fill="#ef4444"/>
  <text x="622" y="75" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">Reflection 反思</text>
  <path d="M680 70 L695 70" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="700" y="45" width="85" height="50" rx="8" fill="#64748b"/>
  <text x="742" y="75" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">Forgetting</text>
  <!-- Descriptions -->
  <text x="72" y="115" text-anchor="middle" fill="#64748b" font-size="9" font-family="sans-serif">交互→结构化</text>
  <text x="207" y="115" text-anchor="middle" fill="#64748b" font-size="9" font-family="sans-serif">写入向量库</text>
  <text x="342" y="115" text-anchor="middle" fill="#64748b" font-size="9" font-family="sans-serif">语义召回</text>
  <text x="482" y="115" text-anchor="middle" fill="#64748b" font-size="9" font-family="sans-serif">短期→长期</text>
  <text x="622" y="115" text-anchor="middle" fill="#64748b" font-size="9" font-family="sans-serif">提取元知识</text>
  <text x="742" y="115" text-anchor="middle" fill="#64748b" font-size="9" font-family="sans-serif">权重衰减</text>
  <!-- Bottom -->
  <text x="400" y="150" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="sans-serif">控制策略：纯规则触发 → 重要性阈值筛选 → 离线 batch job 冲突合并检测</text>
  <text x="400" y="166" text-anchor="middle" fill="#64748b" font-size="9" font-family="sans-serif">多数团队在规则与强化学习间找平衡：importance > 阈值才写入，离线 batch 做合并</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
  </defs>
</svg>
