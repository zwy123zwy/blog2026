<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
  <rect width="800" height="350" fill="#0f172a"/>
  <text x="400" y="28" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold" font-family="sans-serif">Agent 记忆分类全景图</text>
  <!-- Time dimension: Short -->
  <rect x="25" y="50" width="370" height="90" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="210" y="78" text-anchor="middle" fill="#60a5fa" font-size="14" font-weight="bold" font-family="sans-serif">短期记忆（Session 级）</text>
  <text x="210" y="100" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">依托上下文窗口 | 滑动窗口管理</text>
  <text x="210" y="118" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">对话历史 + 工具调用结果 + 中间推理</text>
  <text x="210" y="136" text-anchor="middle" fill="#64748b" font-size="10" font-family="sans-serif">随 Session 结束而销毁</text>
  <!-- Time dimension: Long -->
  <rect x="405" y="50" width="370" height="90" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="590" y="78" text-anchor="middle" fill="#34d399" font-size="14" font-weight="bold" font-family="sans-serif">长期记忆（跨 Session 级）</text>
  <text x="590" y="100" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">向量数据库 + 图数据库 | 持久化</text>
  <text x="590" y="118" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">用户偏好 + 历史决策 + 项目知识</text>
  <text x="590" y="136" text-anchor="middle" fill="#64748b" font-size="10" font-family="sans-serif">跨 Session 持久存在</text>
  <!-- Storage types -->
  <rect x="25" y="160" width="240" height="65" rx="8" fill="#8b5cf6"/>
  <text x="145" y="185" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">Token 级记忆</text>
  <text x="145" y="205" text-anchor="middle" fill="#ddd6fe" font-size="10" font-family="sans-serif">向量库文本 / 结构化JSON</text>
  <rect x="280" y="160" width="240" height="65" rx="8" fill="#f59e0b"/>
  <text x="400" y="185" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">参数化记忆</text>
  <text x="400" y="205" text-anchor="middle" fill="#fef3c7" font-size="10" font-family="sans-serif">预训练 / LoRA / SFT 微调</text>
  <rect x="535" y="160" width="240" height="65" rx="8" fill="#ef4444"/>
  <text x="655" y="185" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">潜在记忆</text>
  <text x="655" y="205" text-anchor="middle" fill="#fecaca" font-size="10" font-family="sans-serif">KV Cache / Hidden States</text>
  <!-- Function types -->
  <rect x="25" y="245" width="240" height="50" rx="8" fill="#06b6d4"/>
  <text x="145" y="268" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">事实记忆</text>
  <text x="145" y="286" text-anchor="middle" fill="#cffafe" font-size="10" font-family="sans-serif">Agent 知道什么？</text>
  <rect x="280" y="245" width="240" height="50" rx="8" fill="#f59e0b"/>
  <text x="400" y="268" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">经验记忆</text>
  <text x="400" y="286" text-anchor="middle" fill="#fef3c7" font-size="10" font-family="sans-serif">Agent 如何改进？</text>
  <rect x="535" y="245" width="240" height="50" rx="8" fill="#10b981"/>
  <text x="655" y="268" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">工作记忆</text>
  <text x="655" y="286" text-anchor="middle" fill="#d1fae5" font-size="10" font-family="sans-serif">Agent 当前思考什么？</text>
</svg>
