<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420">
  <rect width="800" height="420" fill="#0f172a"/>
  <text x="400" y="32" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold" font-family="sans-serif">Multi-Agent 多智能体协作架构</text>
  <!-- Orchestrator -->
  <rect x="280" y="55" width="240" height="50" rx="10" fill="#8b5cf6"/>
  <text x="400" y="75" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold" font-family="sans-serif">Orchestrator 编排 Agent</text>
  <text x="400" y="94" text-anchor="middle" fill="#ddd6fe" font-size="11" font-family="sans-serif">全局规划 + 任务分发 + 结果汇总</text>
  <!-- Lines from orchestrator -->
  <line x1="340" y1="105" x2="160" y2="150" stroke="#64748b" stroke-width="1.5"/>
  <line x1="400" y1="105" x2="400" y2="150" stroke="#64748b" stroke-width="1.5"/>
  <line x1="460" y1="105" x2="640" y2="150" stroke="#64748b" stroke-width="1.5"/>
  <!-- Sub-agents row 1 -->
  <rect x="40" y="155" width="240" height="70" rx="8" fill="#3b82f6"/>
  <text x="160" y="182" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold" font-family="sans-serif">Sub-Agent A</text>
  <text x="160" y="200" text-anchor="middle" fill="#bfdbfe" font-size="10" font-family="sans-serif">信息检索与 RAG</text>
  <text x="160" y="214" text-anchor="middle" fill="#bfdbfe" font-size="10" font-family="sans-serif">搜索、向量检索、文档查询</text>
  <rect x="280" y="155" width="240" height="70" rx="8" fill="#f59e0b"/>
  <text x="400" y="182" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold" font-family="sans-serif">Sub-Agent B</text>
  <text x="400" y="200" text-anchor="middle" fill="#fef3c7" font-size="10" font-family="sans-serif">代码生成与修改</text>
  <text x="400" y="214" text-anchor="middle" fill="#fef3c7" font-size="10" font-family="sans-serif">写代码、修 Bug、重构</text>
  <rect x="520" y="155" width="240" height="70" rx="8" fill="#10b981"/>
  <text x="640" y="182" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold" font-family="sans-serif">Sub-Agent C</text>
  <text x="640" y="200" text-anchor="middle" fill="#d1fae5" font-size="10" font-family="sans-serif">质量审查与测试</text>
  <text x="640" y="214" text-anchor="middle" fill="#d1fae5" font-size="10" font-family="sans-serif">Review、测试、安全检查</text>
  <!-- Lines back -->
  <line x1="160" y1="225" x2="280" y2="270" stroke="#64748b" stroke-width="1.5"/>
  <line x1="400" y1="225" x2="380" y2="270" stroke="#64748b" stroke-width="1.5"/>
  <line x1="640" y1="225" x2="520" y2="270" stroke="#64748b" stroke-width="1.5"/>
  <!-- Summary -->
  <rect x="220" y="275" width="360" height="55" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="400" y="300" text-anchor="middle" fill="#c084fc" font-size="13" font-weight="bold" font-family="sans-serif">Orchestrator 汇总各子 Agent 输出</text>
  <text x="400" y="320" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">去重、融合、生成最终答案</text>
  <!-- Peer-to-Peer alternative -->
  <rect x="30" y="355" width="740" height="48" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="400" y="375" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">Peer-to-Peer 模式（备选）：Agent 间平等对话、相互审查，适合辩论/验证场景</text>
  <text x="400" y="393" text-anchor="middle" fill="#64748b" font-size="10" font-family="sans-serif">优势：并行效率高、专业化分工、单点容错 | 代价：通信开销、协调复杂、调试难度</text>
</svg>
