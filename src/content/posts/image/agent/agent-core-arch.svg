<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1a2e"/><stop offset="1" stop-color="#16213e"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a9eff"/><stop offset="1" stop-color="#2d6ad0"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#22a35e"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fb923c"/><stop offset="1" stop-color="#d97706"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c084fc"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Title -->
  <text x="400" y="42" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold" font-family="sans-serif">AI Agent 核心架构</text>
  <text x="400" y="66" text-anchor="middle" fill="#94a3b8" font-size="13" font-family="sans-serif">Agent = LLM + Planning + Memory + Tools</text>
  <!-- Central LLM Node -->
  <rect x="300" y="180" width="200" height="80" rx="12" fill="url(#blue)"/>
  <text x="400" y="215" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold" font-family="sans-serif">LLM</text>
  <text x="400" y="238" text-anchor="middle" fill="#dbeafe" font-size="12" font-family="sans-serif">大语言模型（大脑）</text>
  <!-- Planning -->
  <rect x="60" y="100" width="170" height="60" rx="10" fill="url(#green)"/>
  <text x="145" y="128" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold" font-family="sans-serif">Planning 规划</text>
  <text x="145" y="148" text-anchor="middle" fill="#dcfce7" font-size="11" font-family="sans-serif">任务拆解 / CoT 推理</text>
  <line x1="230" y1="130" x2="300" y2="200" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowG)"/>
  <!-- Memory -->
  <rect x="570" y="100" width="170" height="60" rx="10" fill="url(#orange)"/>
  <text x="655" y="128" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold" font-family="sans-serif">Memory 记忆</text>
  <text x="655" y="148" text-anchor="middle" fill="#fef3c7" font-size="11" font-family="sans-serif">短期 + 长期记忆</text>
  <line x1="570" y1="130" x2="500" y2="200" stroke="#fb923c" stroke-width="2" marker-end="url(#arrowO)"/>
  <!-- Tools -->
  <rect x="60" y="340" width="170" height="60" rx="10" fill="url(#purple)"/>
  <text x="145" y="368" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold" font-family="sans-serif">Tools 工具</text>
  <text x="145" y="388" text-anchor="middle" fill="#f3e8ff" font-size="11" font-family="sans-serif">API / 代码执行 / MCP</text>
  <line x1="230" y1="370" x2="300" y2="240" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowP)"/>
  <!-- Observation -->
  <rect x="570" y="340" width="170" height="60" rx="10" fill="#64748b"/>
  <text x="655" y="368" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold" font-family="sans-serif">Observation 观察</text>
  <text x="655" y="388" text-anchor="middle" fill="#cbd5e1" font-size="11" font-family="sans-serif">工具执行结果反馈</text>
  <line x1="570" y1="370" x2="500" y2="240" stroke="#64748b" stroke-width="2" marker-end="url(#arrowG2)"/>
  <!-- Feedback loop -->
  <path d="M145 400 L145 440 L655 440 L655 400" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="400" y="458" text-anchor="middle" fill="#64748b" font-size="11" font-family="sans-serif">闭环反馈机制</text>
  <!-- Arrows -->
  <defs>
    <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#4ade80"/></marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10,0 L0,5 L10,10 Z" fill="#fb923c"/></marker>
    <marker id="arrowP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#c084fc"/></marker>
    <marker id="arrowG2" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M10,0 L0,5 L10,10 Z" fill="#64748b"/></marker>
  </defs>
</svg>
