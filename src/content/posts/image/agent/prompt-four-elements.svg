<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260">
  <rect width="800" height="260" fill="#0f172a"/>
  <text x="400" y="28" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold" font-family="sans-serif">Prompt 四要素框架</text>
  <text x="400" y="48" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">Role + Task + Context + Format</text>
  <rect x="25" y="65" width="175" height="85" rx="10" fill="#3b82f6"/>
  <text x="112" y="95" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold" font-family="sans-serif">Role 角色</text>
  <text x="112" y="115" text-anchor="middle" fill="#bfdbfe" font-size="10" font-family="sans-serif">激活相关知识领域</text>
  <text x="112" y="135" text-anchor="middle" fill="#bfdbfe" font-size="10" font-family="sans-serif">"10年经验的架构师"</text>
  <rect x="215" y="65" width="175" height="85" rx="10" fill="#f59e0b"/>
  <text x="302" y="95" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold" font-family="sans-serif">Task 任务</text>
  <text x="302" y="115" text-anchor="middle" fill="#fef3c7" font-size="10" font-family="sans-serif">明确要完成的具体动作</text>
  <text x="302" y="135" text-anchor="middle" fill="#fef3c7" font-size="10" font-family="sans-serif">"评审以下代码的性能"</text>
  <rect x="405" y="65" width="175" height="85" rx="10" fill="#10b981"/>
  <text x="492" y="95" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold" font-family="sans-serif">Context 上下文</text>
  <text x="492" y="115" text-anchor="middle" fill="#d1fae5" font-size="10" font-family="sans-serif">提供任务背景信息</text>
  <text x="492" y="135" text-anchor="middle" fill="#d1fae5" font-size="10" font-family="sans-serif">"QPS 2000，超500ms"</text>
  <rect x="595" y="65" width="180" height="85" rx="10" fill="#8b5cf6"/>
  <text x="685" y="95" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold" font-family="sans-serif">Format 格式</text>
  <text x="685" y="115" text-anchor="middle" fill="#ddd6fe" font-size="10" font-family="sans-serif">指定输出的结构要求</text>
  <text x="685" y="135" text-anchor="middle" fill="#ddd6fe" font-size="10" font-family="sans-serif">"输出JSON，含..."</text>
  <!-- Bottom tip -->
  <rect x="50" y="172" width="700" height="70" rx="6" fill="#1e293b"/>
  <text x="400" y="195" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">利用 Lost in the Middle 效应：</text>
  <text x="400" y="215" text-anchor="middle" fill="#60a5fa" font-size="11" font-family="sans-serif">角色定义放开头（首因效应）→ 格式要求放结尾（近因效应）→ 背景信息层次分明</text>
  <text x="400" y="235" text-anchor="middle" fill="#64748b" font-size="10" font-family="sans-serif">核心原则：不是写得长，而是把任务边界、上下文和输出要求说清楚</text>
</svg>
