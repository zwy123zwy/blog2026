<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380">
  <rect width="800" height="380" fill="#0f172a"/>
  <text x="400" y="30" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold" font-family="sans-serif">Agentic Workflows 四大核心设计模式</text>
  <text x="400" y="52" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">吴恩达（Andrew Ng）：用工程思维把推理、记忆、反思、协作编排成工业级流水线</text>
  <!-- 4 boxes -->
  <rect x="30" y="75" width="170" height="120" rx="10" fill="#3b82f6"/>
  <text x="115" y="105" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold" font-family="sans-serif">① Reflection</text>
  <text x="115" y="125" text-anchor="middle" fill="#bfdbfe" font-size="10" font-family="sans-serif">自我反思</text>
  <text x="115" y="145" text-anchor="middle" fill="#bfdbfe" font-size="10" font-family="sans-serif">让模型检查</text>
  <text x="115" y="165" text-anchor="middle" fill="#bfdbfe" font-size="10" font-family="sans-serif">自己的工作成果</text>
  <text x="115" y="185" text-anchor="middle" fill="#93c5fd" font-size="10" font-family="sans-serif">Reflexion / Self-Refine</text>
  <rect x="215" y="75" width="170" height="120" rx="10" fill="#f59e0b"/>
  <text x="300" y="105" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold" font-family="sans-serif">② Tool Use</text>
  <text x="300" y="125" text-anchor="middle" fill="#fef3c7" font-size="10" font-family="sans-serif">工具使用</text>
  <text x="300" y="145" text-anchor="middle" fill="#fef3c7" font-size="10" font-family="sans-serif">网络搜索、代码执行</text>
  <text x="300" y="165" text-anchor="middle" fill="#fef3c7" font-size="10" font-family="sans-serif">Function Calling</text>
  <text x="300" y="185" text-anchor="middle" fill="#fcd34d" font-size="10" font-family="sans-serif">MCP 工具接入</text>
  <rect x="400" y="75" width="170" height="120" rx="10" fill="#8b5cf6"/>
  <text x="485" y="105" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold" font-family="sans-serif">③ Planning</text>
  <text x="485" y="125" text-anchor="middle" fill="#ddd6fe" font-size="10" font-family="sans-serif">任务规划</text>
  <text x="485" y="145" text-anchor="middle" fill="#ddd6fe" font-size="10" font-family="sans-serif">多步计划</text>
  <text x="485" y="165" text-anchor="middle" fill="#ddd6fe" font-size="10" font-family="sans-serif">分解 + 执行</text>
  <text x="485" y="185" text-anchor="middle" fill="#c4b5fd" font-size="10" font-family="sans-serif">Plan-and-Execute</text>
  <rect x="585" y="75" width="185" height="120" rx="10" fill="#10b981"/>
  <text x="678" y="105" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold" font-family="sans-serif">④ Multi-agent</text>
  <text x="678" y="125" text-anchor="middle" fill="#d1fae5" font-size="10" font-family="sans-serif">多智能体协作</text>
  <text x="678" y="145" text-anchor="middle" fill="#d1fae5" font-size="10" font-family="sans-serif">多个 Agent</text>
  <text x="678" y="165" text-anchor="middle" fill="#d1fae5" font-size="10" font-family="sans-serif">分工协作</text>
  <text x="678" y="185" text-anchor="middle" fill="#6ee7b7" font-size="10" font-family="sans-serif">Orchestrator-Subagent</text>
  <!-- Integration flow -->
  <rect x="60" y="225" width="680" height="65" rx="8" fill="#1e293b"/>
  <text x="400" y="250" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold" font-family="sans-serif">实际项目中的组合使用</text>
  <text x="400" y="272" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">Planning 分解任务 → Tool Use 执行 → Reflection 验证</text>
  <text x="400" y="290" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">→ 未达标则循环修正 → Multi-agent 协作完成大型项目</text>
  <!-- Bottom -->
  <rect x="100" y="310" width="600" height="50" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="400" y="335" text-anchor="middle" fill="#fcd34d" font-size="12" font-family="sans-serif">核心观点：不需要等底层模型突破，工程编排就是当前最成熟的路</text>
  <text x="400" y="352" text-anchor="middle" fill="#fcd34d" font-size="11" font-family="sans-serif">从"玩具"走向"工业级生产力"</text>
</svg>
