<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240">
  <rect width="800" height="240" fill="#0f172a"/>
  <text x="400" y="28" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold" font-family="sans-serif">Prompt / Context / Harness Engineering 三层嵌套关系</text>
  <!-- PE inner -->
  <rect x="240" y="55" width="320" height="45" rx="8" fill="#3b82f6"/>
  <text x="400" y="78" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold" font-family="sans-serif">Prompt Engineering（表达层）</text>
  <text x="400" y="93" text-anchor="middle" fill="#bfdbfe" font-size="10" font-family="sans-serif">怎么写好指令——让模型听懂意图</text>
  <!-- CE middle -->
  <rect x="140" y="110" width="520" height="45" rx="8" fill="#8b5cf6"/>
  <text x="400" y="133" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold" font-family="sans-serif">Context Engineering（信息层）</text>
  <text x="400" y="148" text-anchor="middle" fill="#ddd6fe" font-size="10" font-family="sans-serif">给 Agent 看什么——合适时机拿到正确信息</text>
  <!-- HE outer -->
  <rect x="40" y="165" width="720" height="55" rx="8" fill="#f59e0b"/>
  <text x="400" y="188" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold" font-family="sans-serif">Harness Engineering（执行层）</text>
  <text x="400" y="205" text-anchor="middle" fill="#fef3c7" font-size="10" font-family="sans-serif">系统怎么防崩、怎么量化、怎么持续运转——长链路正确、偏差纠正、故障恢复</text>
  <!-- Note -->
  <text x="400" y="235" text-anchor="middle" fill="#64748b" font-size="10" font-family="sans-serif">三者的关系：不是并列，而是嵌套——每一层解决完全不同的问题</text>
</svg>
