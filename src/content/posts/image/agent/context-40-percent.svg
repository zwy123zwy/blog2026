<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260">
  <rect width="800" height="260" fill="#0f172a"/>
  <text x="400" y="28" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold" font-family="sans-serif">上下文利用率 40% 阈值现象</text>
  <text x="400" y="48" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">168K Token 窗口，用到 40% 时 Agent 输出质量开始明显下降</text>
  <!-- Bar -->
  <rect x="100" y="70" width="600" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="100" y="70" width="240" height="50" rx="6" fill="#10b981"/>
  <text x="220" y="100" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold" font-family="sans-serif">Smart Zone（0~40%）</text>
  <rect x="340" y="70" width="360" height="50" rx="6" fill="#ef4444"/>
  <line x1="340" y1="65" x2="340" y2="125" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="520" y="100" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold" font-family="sans-serif">Dumb Zone（>40%）</text>
  <text x="340" y="62" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="bold" font-family="sans-serif">40% 阈值</text>
  <!-- Signs -->
  <rect x="60" y="140" width="325" height="55" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="222" y="160" text-anchor="middle" fill="#86efac" font-size="11" font-family="sans-serif">Smart Zone 表现</text>
  <text x="222" y="178" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="sans-serif">推理聚焦 · 工具调用准确 · 代码质量高</text>
  <rect x="415" y="140" width="325" height="55" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
  <text x="577" y="160" text-anchor="middle" fill="#fca5a5" font-size="11" font-family="sans-serif">Dumb Zone 表现</text>
  <text x="577" y="178" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="sans-serif">幻觉增多 · 兜圈子 · 格式混乱 · 低质量代码</text>
  <!-- Action -->
  <rect x="100" y="210" width="600" height="38" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="400" y="232" text-anchor="middle" fill="#fbbf24" font-size="11" font-family="sans-serif">工程建议：设置 40% 阈值告警 → 触发上下文压缩或子任务交接</text>
  <text x="400" y="244" text-anchor="middle" fill="#64748b" font-size="9" font-family="sans-serif">目标不是塞更多信息，而是让 Agent 始终运行在干净、相关的上下文里</text>
</svg>
