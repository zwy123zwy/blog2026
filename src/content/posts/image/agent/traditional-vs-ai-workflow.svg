<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <rect width="800" height="300" fill="#0f172a"/>
  <text x="400" y="28" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold" font-family="sans-serif">传统 Workflow vs AI Workflow</text>
  <!-- Traditional -->
  <rect x="30" y="50" width="360" height="120" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="210" y="78" text-anchor="middle" fill="#60a5fa" font-size="15" font-weight="bold" font-family="sans-serif">传统 Workflow</text>
  <text x="210" y="100" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">固定步骤 + 明确分支</text>
  <text x="210" y="118" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">设计时确定分支（金额>10000走高级审批）</text>
  <text x="210" y="138" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">相同输入 → 相同输出（确定性）</text>
  <text x="210" y="158" text-anchor="middle" fill="#64748b" font-size="10" font-family="sans-serif">代表：BPMN 2.0 / Camunda / Temporal</text>
  <!-- AI -->
  <rect x="410" y="50" width="360" height="120" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="590" y="78" text-anchor="middle" fill="#34d399" font-size="15" font-weight="bold" font-family="sans-serif">AI Workflow</text>
  <text x="590" y="100" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">动态决策 + 状态驱动 + 可控循环</text>
  <text x="590" y="118" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">运行时评估生成质量决定分支</text>
  <text x="590" y="138" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">同一节点可能反复执行修正</text>
  <text x="590" y="158" text-anchor="middle" fill="#64748b" font-size="10" font-family="sans-serif">代表：Spring AI Alibaba / LangGraph</text>
  <!-- Bottom -->
  <rect x="30" y="195" width="740" height="85" rx="6" fill="#1e293b"/>
  <text x="400" y="218" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold" font-family="sans-serif">关键差异</text>
  <text x="400" y="240" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">传统分支在设计时确定，AI 分支依赖运行时 LLM 输出质量评估</text>
  <text x="400" y="258" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">节点间传递的不止参数——还有上下文、草稿、评分、错误信息、历史轮次</text>
  <text x="400" y="276" text-anchor="middle" fill="#64748b" font-size="10" font-family="sans-serif">AI Workflow 需要处理不确定性：动态决策、自动修正、可控收敛</text>
</svg>
