<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320">
  <rect width="800" height="320" fill="#0f172a"/>
  <text x="400" y="30" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold" font-family="sans-serif">Graph 核心三元素：Node、Edge、State</text>
  <!-- Node -->
  <rect x="25" y="55" width="240" height="110" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="145" y="82" text-anchor="middle" fill="#60a5fa" font-size="15" font-weight="bold" font-family="sans-serif">Node 节点</text>
  <text x="145" y="102" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">执行单元</text>
  <text x="145" y="120" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">读取状态 → 执行逻辑</text>
  <text x="145" y="138" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">→ 更新状态</text>
  <text x="145" y="156" text-anchor="middle" fill="#64748b" font-size="10" font-family="sans-serif">DraftNode / ReviewNode / ReviseNode</text>
  <!-- Edge -->
  <rect x="280" y="55" width="240" height="110" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="400" y="82" text-anchor="middle" fill="#fbbf24" font-size="15" font-weight="bold" font-family="sans-serif">Edge 边</text>
  <text x="400" y="102" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">控制流抽象</text>
  <text x="400" y="120" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">顺序 | 条件 | 动态路由</text>
  <text x="400" y="138" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">循环(回边) | 终止 | 并行</text>
  <text x="400" y="156" text-anchor="middle" fill="#64748b" font-size="10" font-family="sans-serif">addEdge / addConditionalEdges</text>
  <!-- State -->
  <rect x="535" y="55" width="240" height="110" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="655" y="82" text-anchor="middle" fill="#34d399" font-size="15" font-weight="bold" font-family="sans-serif">State 状态</text>
  <text x="655" y="102" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">共享上下文</text>
  <text x="655" y="120" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">Replace | Append | Reducer</text>
  <text x="655" y="138" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="sans-serif">input / messages / draft</text>
  <text x="655" y="156" text-anchor="middle" fill="#64748b" font-size="10" font-family="sans-serif">review_score / next_node / output</text>
  <!-- Bottom -->
  <rect x="50" y="185" width="700" height="120" rx="6" fill="#1e293b"/>
  <text x="400" y="210" text-anchor="middle" fill="#fff" font-size="13" font-weight="bold" font-family="sans-serif">三种 State 更新策略</text>
  <!-- Replace -->
  <rect x="70" y="220" width="210" height="35" rx="5" fill="#3b82f6"/>
  <text x="175" y="242" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">Replace 覆盖：新值替换旧值</text>
  <rect x="295" y="220" width="210" height="35" rx="5" fill="#f59e0b"/>
  <text x="400" y="242" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">Append 追加：新值追加到列表</text>
  <rect x="520" y="220" width="210" height="35" rx="5" fill="#10b981"/>
  <text x="625" y="242" text-anchor="middle" fill="#fff" font-size="11" font-family="sans-serif">Reducer 合并：自定义逻辑</text>
  <text x="400" y="280" text-anchor="middle" fill="#64748b" font-size="11" font-family="sans-serif">多节点并行写入同一覆盖语义字段 → 竞态错误 | 需提前规划更新策略</text>
</svg>
