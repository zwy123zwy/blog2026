<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340">
  <rect width="800" height="340" fill="#0f172a"/>
  <text x="400" y="30" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold" font-family="sans-serif">Skill 路由流程</text>
  <!-- Step 1 -->
  <rect x="40" y="55" width="170" height="65" rx="8" fill="#3b82f6"/>
  <text x="125" y="78" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">① 向量化粗筛</text>
  <text x="125" y="96" text-anchor="middle" fill="#bfdbfe" font-size="10" font-family="sans-serif">Query → Embedding</text>
  <text x="125" y="112" text-anchor="middle" fill="#bfdbfe" font-size="10" font-family="sans-serif">余弦相似度 Top-5</text>
  <path d="M210 87 L250 87" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <!-- Step 2 -->
  <rect x="255" y="55" width="170" height="65" rx="8" fill="#8b5cf6"/>
  <text x="340" y="78" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">② 精排 Rerank</text>
  <text x="340" y="96" text-anchor="middle" fill="#ddd6fe" font-size="10" font-family="sans-serif">轻量 rerank 模型 / 规则</text>
  <text x="340" y="112" text-anchor="middle" fill="#ddd6fe" font-size="10" font-family="sans-serif">title+desc+example 加权</text>
  <path d="M425 87 L465 87" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <!-- Step 3 -->
  <rect x="470" y="55" width="170" height="65" rx="8" fill="#f59e0b"/>
  <text x="555" y="78" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">③ 激活 / 不激活</text>
  <text x="555" y="96" text-anchor="middle" fill="#fef3c7" font-size="10" font-family="sans-serif">高分 → 加载正文</text>
  <text x="555" y="112" text-anchor="middle" fill="#fef3c7" font-size="10" font-family="sans-serif">低分 → 默认流程</text>
  <path d="M640 87 L680 87" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <!-- Step 4 -->
  <rect x="685" y="55" width="80" height="65" rx="8" fill="#10b981"/>
  <text x="725" y="90" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">④ 执行</text>
  <!-- Router architecture -->
  <rect x="30" y="150" width="740" height="50" rx="6" fill="#1e293b"/>
  <text x="400" y="172" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">通用调度器四块组件</text>
  <text x="400" y="192" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="sans-serif">注册中心（元信息+向量）→ 路由引擎（召回+打分）→ 加载器（按需读正文）→ 上下文装配器（拼到何处）</text>
  <!-- Tips -->
  <rect x="30" y="215" width="230" height="55" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
  <text x="145" y="238" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="bold" font-family="sans-serif">冷启动问题</text>
  <text x="145" y="256" text-anchor="middle" fill="#fca5a5" font-size="10" font-family="sans-serif">新 Skill 加 examples 字段</text>
  <text x="145" y="270" text-anchor="middle" fill="#fca5a5" font-size="10" font-family="sans-serif">写真实用户可能怎么问</text>
  <rect x="285" y="215" width="230" height="55" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="400" y="238" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="bold" font-family="sans-serif">安全类/数据库类</text>
  <text x="400" y="256" text-anchor="middle" fill="#fbbf24" font-size="10" font-family="sans-serif">高风险 Skill 阈值设高</text>
  <text x="400" y="270" text-anchor="middle" fill="#fbbf24" font-size="10" font-family="sans-serif">别乱触发</text>
  <rect x="540" y="215" width="230" height="55" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="655" y="238" text-anchor="middle" fill="#86efac" font-size="11" font-weight="bold" font-family="sans-serif">"不选"比"硬选"安全</text>
  <text x="655" y="256" text-anchor="middle" fill="#86efac" font-size="10" font-family="sans-serif">最高分都很低 → 默认流程</text>
  <text x="655" y="270" text-anchor="middle" fill="#86efac" font-size="10" font-family="sans-serif">避免选错导致执行跑偏</text>
  <rect x="100" y="285" width="600" height="38" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <text x="400" y="308" text-anchor="middle" fill="#64748b" font-size="11" font-family="sans-serif">几十个 Skill：NumPy 内存算相似度即可 | 几百上千：FAISS/ANN 索引/专用向量库</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
  </defs>
</svg>
