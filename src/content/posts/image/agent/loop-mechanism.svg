<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280">
  <rect width="800" height="280" fill="#0f172a"/>
  <text x="400" y="28" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold" font-family="sans-serif">Loop 循环机制：图上的回溯控制</text>
  <!-- Flow -->
  <rect x="60" y="55" width="140" height="50" rx="8" fill="#3b82f6"/>
  <text x="130" y="85" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold" font-family="sans-serif">生成初稿</text>
  <path d="M200 80 L240 80" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="245" y="55" width="140" height="50" rx="8" fill="#8b5cf6"/>
  <text x="315" y="85" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold" font-family="sans-serif">质量审核</text>
  <path d="M385 80 L425 80" stroke="#64748b" stroke-width="2"/>
  <!-- Decision diamond -->
  <polygon points="430,50 490,80 430,110 370,80" fill="#f59e0b"/>
  <text x="430" y="85" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold" font-family="sans-serif">达标?</text>
  <!-- Yes -->
  <path d="M490 80 L560 80" stroke="#10b981" stroke-width="2" marker-end="url(#g)"/>
  <text x="525" y="72" text-anchor="middle" fill="#10b981" font-size="10" font-family="sans-serif">是</text>
  <rect x="565" y="55" width="120" height="50" rx="8" fill="#10b981"/>
  <text x="625" y="85" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold" font-family="sans-serif">输出结果</text>
  <!-- No -->
  <path d="M430 110 L430 150 L315 150 L315 110" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#r)"/>
  <text x="430" y="135" text-anchor="middle" fill="#ef4444" font-size="10" font-family="sans-serif">否→修改后重新审核（循环）</text>
  <!-- Loop info -->
  <rect x="60" y="170" width="320" height="50" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <text x="220" y="192" text-anchor="middle" fill="#60a5fa" font-size="11" font-family="sans-serif">固定次数循环：最多重试 3 次</text>
  <text x="220" y="210" text-anchor="middle" fill="#64748b" font-size="10" font-family="sans-serif">类似 for 循环</text>
  <rect x="420" y="170" width="320" height="50" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="580" y="192" text-anchor="middle" fill="#fbbf24" font-size="11" font-family="sans-serif">条件驱动循环：评分 &lt; 80 就继续修改</text>
  <text x="580" y="210" text-anchor="middle" fill="#64748b" font-size="10" font-family="sans-serif">类似 while 循环</text>
  <!-- Safety -->
  <rect x="80" y="230" width="640" height="40" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1"/>
  <text x="400" y="248" text-anchor="middle" fill="#fca5a5" font-size="11" font-family="sans-serif">三要素 ① 继续条件（为何再来）② 退出条件（何时够了）③ 安全边界（最大轮次+超时+预算+熔断）</text>
  <text x="400" y="264" text-anchor="middle" fill="#fca5a5" font-size="11" font-family="sans-serif">缺少任何一项 → Loop 从"自我修正"变成"无限打转"</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#10b981"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ef4444"/></marker>
  </defs>
</svg>
