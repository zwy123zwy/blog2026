<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280">
  <rect width="800" height="280" fill="#0f172a"/>
  <text x="400" y="28" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold" font-family="sans-serif">Anthropic 三智能体协同架构（受 GAN 启发）</text>
  <!-- Planner -->
  <rect x="40" y="55" width="220" height="80" rx="10" fill="#3b82f6"/>
  <text x="150" y="82" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold" font-family="sans-serif">Planner 规划者</text>
  <text x="150" y="102" text-anchor="middle" fill="#bfdbfe" font-size="10" font-family="sans-serif">拿到 1-4 句话产品描述</text>
  <text x="150" y="118" text-anchor="middle" fill="#bfdbfe" font-size="10" font-family="sans-serif">扩展为完整产品规格</text>
  <text x="150" y="132" text-anchor="middle" fill="#93c5fd" font-size="9" font-family="sans-serif">"在范围上要大胆"</text>
  <path d="M260 95 L300 95" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <!-- Generator -->
  <rect x="305" y="55" width="220" height="80" rx="10" fill="#8b5cf6"/>
  <text x="415" y="82" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold" font-family="sans-serif">Generator 执行者</text>
  <text x="415" y="102" text-anchor="middle" fill="#ddd6fe" font-size="10" font-family="sans-serif">按功能一个个做 Sprint</text>
  <text x="415" y="118" text-anchor="middle" fill="#ddd6fe" font-size="10" font-family="sans-serif">每个 Sprint 有明确完成标准</text>
  <text x="415" y="132" text-anchor="middle" fill="#c4b5fd" font-size="9" font-family="sans-serif"/>
  <path d="M525 95 L560 95" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <!-- Evaluator -->
  <rect x="565" y="55" width="200" height="80" rx="10" fill="#f59e0b"/>
  <text x="665" y="82" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold" font-family="sans-serif">Evaluator 评估者</text>
  <text x="665" y="102" text-anchor="middle" fill="#fef3c7" font-size="10" font-family="sans-serif">Playwright MCP</text>
  <text x="665" y="118" text-anchor="middle" fill="#fef3c7" font-size="10" font-family="sans-serif">实际点击运行应用</text>
  <text x="665" y="132" text-anchor="middle" fill="#fcd34d" font-size="9" font-family="sans-serif">设计+功能+代码打分</text>
  <!-- Feedback -->
  <path d="M665 135 L665 175 L415 175 L415 135" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#r)"/>
  <text x="540" y="190" text-anchor="middle" fill="#ef4444" font-size="10" font-family="sans-serif">不通过→返回修改（循环迭代）</text>
  <!-- Bottom -->
  <rect x="50" y="205" width="700" height="60" rx="6" fill="#1e293b"/>
  <text x="400" y="228" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">解决两个核心问题</text>
  <text x="400" y="248" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="sans-serif">① 上下文焦虑：Context Reset + 结构化交接 | ② 自我评价偏差：生成和评估交独立Agent</text>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ef4444"/></marker>
  </defs>
</svg>
